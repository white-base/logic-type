    state.opt = candidate.opt === 1 ? 1 : 0;
    state.edge = Number.isInteger(candidate.edge) && candidate.edge >= 0 && candidate.edge < data.graph.links.length ? candidate.edge : 1;
    state.cells = candidate.cells && typeof candidate.cells === 'object' ? candidate.cells : {};
  }

  function persist() {
    const view = data.views.find(item => item.id === state.view);
    const selection = view ? cellSelection(view) : null;
    const pair = view && selection ? {
      required: view.rows[selection[0]].expr,
      candidate: view.cols[selection[1]].expr
    } : null;
    if (window.openai && typeof window.openai.setWidgetState === 'function') {
      window.openai.setWidgetState({
        modelContent: { perspective: state.view, opt: state.opt, pair },
        privateContent: { kind: 'logic-type-compatibility-v1', view: state.view, opt: state.opt, cells: state.cells, edge: state.edge }
      }).catch(() => {});
    }
  }

  function makePanel(id, label) {
    const button = el('button', 'nav-link', label);
    button.id = 'ltc-tab-' + id;
    button.type = 'button';
    button.setAttribute('role', 'tab');
    button.setAttribute('aria-controls', 'ltc-panel-' + id);
    button.setAttribute('aria-selected', 'false');
    button.dataset.view = id;
    tabs.append(button);
    const panel = el('div', 'compat-stack');
    panel.id = 'ltc-panel-' + id;
    panel.setAttribute('role', 'tabpanel');
    panel.setAttribute('aria-labelledby', button.id);
    panel.hidden = true;
    panels.append(panel);
    return panel;
  }

  function applyTabs() {
    viewIds.forEach(id => {
      const active = state.view === id;
      const button = root.querySelector('#ltc-tab-' + id);
      button.classList.toggle('active', active);
      button.setAttribute('aria-selected', String(active));
      root.querySelector('#ltc-panel-' + id).hidden = !active;
    });
  }

  function detailBox(panel) {
    const box = el('div', 'card');
    const content = el('div', 'compat-detail');
    content.setAttribute('aria-live', 'polite');
    box.append(content);
    panel.append(box);
    return content;
  }

  function legend(panel, functionView) {
    const line = el('div', 'compat-legend text-small');
    [['compat-yes', '✓ 허용'], ['compat-no', '× 거부']].forEach(([className, label]) => {
      const part = el('span');
      const swatch = el('span', 'compat-swatch ' + className);
      swatch.setAttribute('aria-hidden', 'true');
      part.append(swatch, document.createTextNode(label));
      line.append(part);
    });
    if (functionView) {
      const part = el('span');
      const swatch = el('span', 'compat-swatch compat-different');
      swatch.setAttribute('aria-hidden', 'true');
      part.append(swatch, document.createTextNode('현재와 설계안이 다른 관계'));
      line.append(part);
    }
    panel.append(line);
  }

  function cellSelection(view) {
    const pair = state.cells[view.id];
    if (Array.isArray(pair) && Number.isInteger(pair[0]) && Number.isInteger(pair[1])
      && pair[0] >= 0 && pair[0] < view.rows.length && pair[1] >= 0 && pair[1] < view.cols.length) return pair;
    const initial = {
      family: [3, 13], choice: [0, 3], array: [3, 2], record: [1, 2], class: [0, 1],
      function: [1, 0], match: [4, 10]
    };
    return initial[view.id] || [0, 0];
  }

  function currentCells(view) {
    return view.id === 'class' && state.opt === 1 ? view.cells1 : view.cells;
  }

  function updateDetail(view) {
    const [row, col] = cellSelection(view);
    const expected = view.rows[row];
    const target = view.cols[col];
    const result = currentCells(view)[row][col];
    const content = details[view.id];
    content.replaceChildren();
    const status = el('div', 'viz-row');
    status.append(
      el('span', 'viz-badge', result.ok ? '✓ 허용' : '× 거부'),
      el('code', '', view.mode === 'match' ? 'isMatchType(A, value)' : 'isAllowType(A, B' + (view.id === 'class' ? ', ' + state.opt : '') + ')'),
      el('span', '', '→ ' + String(result.ok))
    );
    if (view.proposal) {
      const proposed = view.proposal[row][col].ok;
      status.append(el('span', 'text-small', '치환 설계안: ' + (proposed ? '✓ true' : '× false')));
    }
    content.append(status);
    content.append(el('div', 'compat-expression', 'A · 요구 타입: ' + expected.expr));
    content.append(el('div', 'compat-expression', (view.mode === 'match' ? 'value · 실제 값: ' : 'B · 비교 대상: ') + target.expr));
    if (result.codes) {
      content.append(el('div', 'text-small text-muted compat-expression', result.codes.join(' → ')));
    }
    if (result.changed) content.append(el('div', 'text-small', '* 입력 객체에 기본값이 기록됨'));
    if (view.id === 'function' && result.ok !== view.proposal[row][col].ok) {
      content.append(el('div', 'text-small', '비교 차이: 매개변수의 허용 방향'));
    }
    root.querySelectorAll('[data-matrix="' + view.id + '"]').forEach(button => {
      button.setAttribute('aria-pressed', String(Number(button.dataset.row) === row && Number(button.dataset.col) === col));
    });
  }

  function makeMatrix(view, cells, label, proposed) {
    const container = el('div', 'compat-stack');
    if (label) container.append(el('h3', '', label));
    const scroll = el('div', 'table-responsive');
    const table = el('table', 'table table-sm');
    const caption = el('caption', 'sr-only', view.title + ' — 행: 요구 타입 A, 열: 비교 대상 B. ✓ 허용, × 거부.');
    table.append(caption);
    const head = el('thead');
    const headRow = el('tr');
    headRow.append(el('th', 'text-nowrap', 'A ↓ / B →'));
    view.cols.forEach((item, col) => {
      const th = el('th', 'text-center text-nowrap', 'B' + (col + 1));
      th.scope = 'col';
      th.setAttribute('data-tooltip', item.expr);
      headRow.append(th);
    });
    head.append(headRow);
    table.append(head);
    const body = el('tbody');
    view.rows.forEach((expected, row) => {
      const tr = el('tr');
      const th = el('th', 'text-nowrap', expected.label);
      th.scope = 'row';
      th.setAttribute('data-tooltip', expected.expr);
      tr.append(th);
      view.cols.forEach((target, col) => {
        const result = cells[row][col];
        const td = el('td', 'text-center ' + (result.ok ? 'compat-yes' : 'compat-no'));
        if (view.proposal && view.cells[row][col].ok !== view.proposal[row][col].ok) td.classList.add('compat-different');
        const symbol = (result.ok ? '✓' : '×') + (result.changed ? '*' : '');
        const button = el('button', 'btn btn-ghost viz-tile', symbol);
        button.type = 'button';
        button.dataset.matrix = view.id;
        button.dataset.row = String(row);
        button.dataset.col = String(col);
        button.setAttribute('aria-pressed', 'false');
        button.setAttribute('aria-label', (proposed ? '설계안: ' : '') + expected.expr + ' 타입이 ' + target.expr + (result.ok ? '를 허용' : '를 거부'));
        button.setAttribute('data-tooltip', 'B' + (col + 1) + ' ' + target.expr + ' → ' + expected.expr + ': ' + (result.ok ? '허용' : '거부'));
        td.append(button);
        tr.append(td);
      });
      body.append(tr);
    });
    table.append(body);
    scroll.append(table);
    container.append(scroll);
    return container;
  }

  const overview = makePanel('overview', '포함 방향');
  overview.append(el('h3', '', '대표 choice의 허용 방향'));
  overview.append(el('div', 'text-small', '화살표 B → A: 요구 타입 A가 비교 대상 B를 허용'));
  const graphDetail = detailBox(overview);
  const graphControls = el('div', 'viz-controls');
  const graphLabel = el('label', 'form-label', '관계');
  const graphSelect = el('select', 'form-select');
  graphSelect.setAttribute('aria-label', '확인할 허용 방향');
  data.graph.links.forEach((link, index) => {
    const source = data.graph.nodes.find(node => node.id === link.from);
    const target = data.graph.nodes.find(node => node.id === link.to);
    const option = el('option', '', source.label + ' → ' + target.label);
    option.value = String(index);
    graphSelect.append(option);
  });
  graphLabel.append(graphSelect);
  graphControls.append(graphLabel);
  overview.append(graphControls);
  const graph = document.createElementNS(ns, 'svg');
  graph.classList.add('compat-graph');
  graph.setAttribute('role', 'img');
  graph.setAttribute('aria-label', 'String과 Number는 REQ 선택으로, REQ와 undefined는 OPT 선택으로 허용된다. ALL은 OPT를 허용하고 ERR 선택은 거부한다.');
  overview.append(graph);
  legend(overview, false);
  overview.append(el('div', 'text-small text-muted', 'S = String · N = Number · ALL/REQ/OPT/ERR는 choice kind · 생략한 직접 관계 있음'));

  function svgEl(tag, attrs, text) {
    const item = document.createElementNS(ns, tag);
    Object.entries(attrs || {}).forEach(([key, value]) => item.setAttribute(key, String(value)));
    if (text !== undefined) item.textContent = text;
    return item;
  }

  function drawGraph() {
    const width = Math.max(280, graph.getBoundingClientRect().width);
    const height = 354;
    graph.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
    graph.setAttribute('height', String(height));
    graph.replaceChildren();
    const defs = svgEl('defs');
    ['yes', 'no'].forEach((status, index) => {
      const marker = svgEl('marker', { id: 'ltc-arrow-' + status, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' });
      marker.append(svgEl('path', { d: 'M 0 0 L 10 5 L 0 10 Z', fill: 'var(--viz-series-' + (index + 1) + ')' }));
      defs.append(marker);
    });
    graph.append(defs);
    const left = width * 0.25;
    const right = width * 0.75;
    const nodeWidth = Math.min(156, width * 0.4);
    const halfWidth = nodeWidth / 2;
    const pos = { all:[left,30], err:[right,30], opt:[left,126], req:[left,222], u:[right,222], s:[left,318], n:[right,318] };
    data.graph.links.forEach((link, index) => {
      const from = pos[link.from];
      const to = pos[link.to];
      const horizontal = from[1] === to[1];
      const start = horizontal ? [from[0] - halfWidth, from[1]] : [from[0], from[1] - 20];
      const end = horizontal ? [to[0] + halfWidth + 2, to[1]] : [to[0], to[1] + 22];
      const path = svgEl('path', { d: 'M ' + start[0] + ' ' + start[1] + ' L ' + end[0] + ' ' + end[1], class: 'graph-edge ' + (link.ok ? 'graph-allowed' : 'graph-blocked'), 'marker-end':'url(#ltc-arrow-' + (link.ok ? 'yes' : 'no') + ')', opacity: index === state.edge ? 1 : 0.5 });
      graph.append(path);
      const cx = (start[0] + end[0]) / 2;
      const cy = (start[1] + end[1]) / 2;
      graph.append(svgEl('rect', { x:cx-10, y:cy-10, width:20, height:20, rx:10, class:'graph-label-bg' }));
      graph.append(svgEl('text', { x:cx, y:cy+4, 'text-anchor':'middle' }, link.ok ? '✓' : '×'));
    });
    data.graph.nodes.forEach(node => {
      const [x, y] = pos[node.id];
      graph.append(svgEl('rect', { x:x-halfWidth, y:y-19, width:nodeWidth, height:38, rx:5, class:'graph-node' }));
      graph.append(svgEl('text', { x, y:y+4, 'text-anchor':'middle' }, node.label));
    });
    const selected = data.graph.links[state.edge];
    const source = data.graph.nodes.find(node => node.id === selected.from);
    const target = data.graph.nodes.find(node => node.id === selected.to);
    graphDetail.replaceChildren(
      el('div', '', source.label + ' → ' + target.label + ' · ' + (selected.ok ? '✓ 허용' : '× 거부')),
      el('code', 'compat-expression', 'isAllowType(' + target.expr + ', ' + source.expr + ') → ' + String(selected.ok))
    );
    graphSelect.value = String(state.edge);
  }

  const classMatrices = {};
  data.views.forEach(view => {
    const panel = makePanel(view.id, view.label);
    panel.append(el('h3', '', view.title));
    panel.append(el('div', 'text-small', view.mode === 'match' ? '행 A: 요구 타입 · 열 B: 실제 값' : '행 A: 요구 타입 · 열 B: 비교 대상 타입'));
    details[view.id] = detailBox(panel);
    if (view.id === 'class') {
      const controls = el('div', 'viz-controls');
      const label = el('label', 'form-label', '클래스 비교 방식');
      const select = el('select', 'form-select');
      select.id = 'ltc-class-option';
      [['0','opt=0 · 상속 관계'],['1','opt=1 · 생성 후 구조 비교 허용']].forEach(([value,text]) => {
        const option = el('option', '', text);
        option.value = value;
        select.append(option);
      });
      label.append(select);
      controls.append(label);
      panel.append(controls);
      const slot = el('div');
      slot.append(makeMatrix(view, currentCells(view)));
      classMatrices.slot = slot;
      classMatrices.select = select;
      panel.append(slot);
    } else if (view.proposal) {
      const comparison = el('div', 'compat-comparison');
      comparison.append(makeMatrix(view, view.cells, '현재 동작', false), makeMatrix(view, view.proposal, '치환 설계안 · 미적용', true));
      panel.append(comparison);
    } else {
      panel.append(makeMatrix(view, view.cells));
    }
    legend(panel, Boolean(view.proposal));
    const keys = el('div', 'compat-keys text-small');
    view.cols.forEach((column, index) => {
      const part = el('span', 'compat-key');
      part.append(el('code', '', 'B' + (index + 1)), el('span', '', column.expr));
      keys.append(part);
    });
    panel.append(keys);
    panel.append(el('div', 'text-small text-muted', view.note));
  });

  function refresh() {
    applyTabs();
    classMatrices.select.value = String(state.opt);
    const view = data.views.find(item => item.id === 'class');
    classMatrices.slot.replaceChildren(makeMatrix(view, currentCells(view)));
    data.views.forEach(updateDetail);
    drawGraph();
  }

  root.addEventListener('click', event => {
    const tab = event.target.closest('[data-view]');
    if (tab) {
      state.view = tab.dataset.view;
      persist();
      if (state.view === 'overview') requestAnimationFrame(drawGraph);
      return;
    }
    const cell = event.target.closest('[data-matrix]');
    if (!cell) return;
    const view = data.views.find(item => item.id === cell.dataset.matrix);
    state.cells[view.id] = [Number(cell.dataset.row), Number(cell.dataset.col)];
    updateDetail(view);
    persist();
  });
  tabs.addEventListener('keydown', () => {
    requestAnimationFrame(() => {
      const active = tabs.querySelector('[aria-selected="true"]');
      if (!active || active.dataset.view === state.view) return;
      state.view = active.dataset.view;
      if (state.view === 'overview') drawGraph();
      persist();
    });
  });
  classMatrices.select.addEventListener('change', () => {
    state.opt = Number(classMatrices.select.value);
    const view = data.views.find(item => item.id === 'class');
    classMatrices.slot.replaceChildren(makeMatrix(view, currentCells(view)));
    updateDetail(view);
    persist();
  });
  graphSelect.addEventListener('change', () => {
    state.edge = Number(graphSelect.value);
    drawGraph();
    persist();
  });
  window.addEventListener('openai:set_globals', event => {
    const globals = event.detail && event.detail.globals;
    if (globals && globals.widgetState) {
      readState(globals.widgetState);
      refresh();
    }
  });
  readState(window.openai && window.openai.widgetState);
  refresh();
  new ResizeObserver(() => { if (state.view === 'overview') drawGraph(); }).observe(graph);
})();
</script>
